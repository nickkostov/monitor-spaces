name: Build and release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Test and package Windows x64
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 python3

      - name: Run sanitizer checks
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: make test-sanitize

      - name: Test, cross-compile, inspect, and package
        run: make package

      - name: Verify package checksum
        working-directory: dist
        run: sha256sum --check monitor-spaces-windows-x64.zip.sha256

      - name: Save Windows package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64-package
          path: |
            dist/monitor-spaces-windows-x64.zip
            dist/monitor-spaces-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download tested package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-x64-package
          path: dist

      - name: Verify downloaded package
        working-directory: dist
        run: sha256sum --check monitor-spaces-windows-x64.zip.sha256

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if is_draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$is_draft" != true ]]; then
              echo "Release already published; leaving its assets unchanged."
              exit 0
            fi
          else
            cat > "$RUNNER_TEMP/monitor-spaces-release-notes.md" <<'NOTES'
          Download monitor-spaces-windows-x64.zip for the Windows x64 executable,
          C source, build instructions, and verification notes. The accompanying
          .sha256 file contains the package checksum.

          The executable is unsigned. Live Windows behavior remains unverified.
          NOTES
            release_flags=()
            if [[ "$RELEASE_TAG" == *-* ]]; then
              release_flags+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" \
              --verify-tag --draft --title "Monitor Spaces $RELEASE_TAG" \
              --generate-notes --notes-file "$RUNNER_TEMP/monitor-spaces-release-notes.md" \
              "${release_flags[@]}"
          fi
          gh release upload "$RELEASE_TAG" \
            dist/monitor-spaces-windows-x64.zip \
            dist/monitor-spaces-windows-x64.zip.sha256 --clobber
          gh release edit "$RELEASE_TAG" --draft=false
